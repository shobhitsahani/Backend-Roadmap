services:
  postgres:
    image: postgres:17-alpine
    container_name: backend-roadmap-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: roadmap
      POSTGRES_PASSWORD: roadmap
      POSTGRES_DB: backend_roadmap
    ports:
      - "5432:5432"
    volumes:
      - backend-roadmap-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadmap -d backend_roadmap"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backend-roadmap-db:
